# The release gate from exercise 10, as a pipeline.
#
# The shape is the point: every job produces a signal, and one job at the end
# decides. No job here decides on its own, and no human is asked to remember.
#
# This runs the repository's own exercises as its signals. In your own project
# you would swap each step for the real thing: your control inventory, your
# policy tests, your infrastructure conformance, your evals.

name: governance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  design-review:
    name: Control inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Derive required controls from the agent specification
        run: npm run ex -- 01 --solution

  policy:
    name: Policy and input controls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Tool authorization decisions
        run: npm run ex -- 02 --solution
      - name: Injection filter measurement
        run: npm run ex -- 03 --solution

  evidence:
    name: Audit trail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Trace integrity and redaction
        run: npm run ex -- 04 --solution

  evaluation:
    name: Evaluation gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Compare against the accepted baseline
        run: npm run ex -- 05 --solution

  infrastructure:
    name: Infrastructure conformance
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        exercise: ["06", "07", "08", "09"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Conformance for exercise ${{ matrix.exercise }}
        run: npm run ex -- ${{ matrix.exercise }} --solution

  gate:
    name: Release gate
    runs-on: ubuntu-latest
    needs: [design-review, policy, evidence, evaluation, infrastructure]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Decide
        run: npm run ex -- 10 --solution
      - name: Record the decision
        run: |
          echo "### Governance gate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "All signals passed for \`${GITHUB_SHA::7}\`." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "A gate that nobody can point at afterwards is not evidence." >> "$GITHUB_STEP_SUMMARY"
